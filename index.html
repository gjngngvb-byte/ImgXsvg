<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Screentone FX</title>
    <style>
        :root {
            --bg-base: #0b0f19;
            --bg-panel: #111827;
            --bg-input: #1f2937;
            --border: #374151;
            --accent: #0ea5e9;
            --accent-hover: #38bdf8;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Layout */
        .sidebar {
            width: 340px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            overflow-y: auto;
            z-index: 10;
        }

        .main-view {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background-image: 
                linear-gradient(45deg, #161e2e 25%, transparent 25%), 
                linear-gradient(-45deg, #161e2e 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #161e2e 75%), 
                linear-gradient(-45deg, transparent 75%, #161e2e 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            padding: 2rem;
            overflow: auto;
        }

        /* Typography & Header */
        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        h1 svg {
            color: var(--accent);
        }

        p.subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        /* Controls */
        .control-group {
            margin-bottom: 1.5rem;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .val-display {
            color: var(--accent);
            font-variant-numeric: tabular-nums;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: var(--bg-input);
            border-radius: 2px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* Buttons */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-upload {
            background-color: var(--bg-input);
            color: var(--text-main);
            border: 1px dashed var(--border);
            margin-bottom: 1.5rem;
        }

        .btn-upload:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-primary {
            background-color: var(--accent);
            color: #fff;
            margin-bottom: 0.75rem;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }
        
        .btn-primary:disabled {
            background-color: var(--border);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .btn-outline {
            background-color: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
        }

        .btn-outline:hover {
            background-color: rgba(14, 165, 233, 0.1);
        }

        /* SVG Container */
        #svg-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #svg-container svg {
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            background-color: transparent; /* Supports transparency natively */
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(17, 24, 39, 0.9);
            padding: 1.5rem 2.5rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            color: var(--accent);
            font-weight: 600;
            display: none;
            align-items: center;
            gap: 12px;
            z-index: 20;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(14, 165, 233, 0.3);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Hidden elements */
        input[type="file"] { display: none; }
        #hidden-canvas { display: none; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h1>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
            Vector Screentone
        </h1>
        <p class="subtitle">Editor Vetorial de Hachuras HQ</p>

        <label class="btn btn-upload">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span id="file-name">Carregar Imagem...</span>
            <input type="file" id="upload" accept="image/png, image/jpeg, image/webp">
        </label>

        <div class="control-group">
            <div class="control-header">
                <label>Densidade das Linhas</label>
                <span class="val-display" id="val-density">6px</span>
            </div>
            <input type="range" id="density" min="3" max="15" value="6">
        </div>

        <div class="control-group">
            <div class="control-header">
                <label>Espessura do Traço (Stroke)</label>
                <span class="val-display" id="val-stroke">1.0px</span>
            </div>
            <input type="range" id="stroke" min="0.2" max="3.0" step="0.1" value="1.0">
        </div>

        <div class="control-group">
            <div class="control-header">
                <label>Sensibilidade do Contorno</label>
                <span class="val-display" id="val-edge">80</span>
            </div>
            <input type="range" id="edge" min="10" max="200" value="80">
        </div>

        <div class="control-group">
            <div class="control-header">
                <label>Ângulo da Hachura</label>
                <span class="val-display" id="val-angle">45°</span>
            </div>
            <input type="range" id="angle" min="-90" max="90" value="45">
        </div>

        <div class="control-group">
            <div class="control-header">
                <label>Jitter (Aspecto Manual)</label>
                <span class="val-display" id="val-jitter">1.5</span>
            </div>
            <input type="range" id="jitter" min="0" max="5" step="0.1" value="1.5">
        </div>

        <div style="margin-top: auto;">
            <button id="btn-generate" class="btn btn-primary" disabled>
                Gerar Arte Vetorial
            </button>
            <button id="btn-export" class="btn btn-outline" style="display: none;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Exportar SVG
            </button>
        </div>
    </aside>

    <main class="main-view">
        <div id="loading">
            <div class="spinner"></div>
            Calculando Vetores...
        </div>
        <div id="svg-container">
            <!-- SVG será injetado aqui -->
            <div style="color: var(--border); font-size: 1.1rem; font-weight: 500;">
                Nenhuma imagem carregada
            </div>
        </div>
        <canvas id="hidden-canvas"></canvas>
    </main>

    <script>
        // --- Estado Global ---
        let imgData = null;
        let imgWidth = 0;
        let imgHeight = 0;
        let currentSvgString = "";

        // --- Elementos UI ---
        const uploadInput = document.getElementById('upload');
        const fileNameDisplay = document.getElementById('file-name');
        const btnGenerate = document.getElementById('btn-generate');
        const btnExport = document.getElementById('btn-export');
        const svgContainer = document.getElementById('svg-container');
        const canvas = document.getElementById('hidden-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const loading = document.getElementById('loading');

        // Sliders
        const controls = ['density', 'stroke', 'edge', 'angle', 'jitter'];
        const settings = {};

        controls.forEach(id => {
            const el = document.getElementById(id);
            const valEl = document.getElementById(`val-${id}`);
            
            // Atualiza display dos valores em tempo real
            el.addEventListener('input', (e) => {
                let suffix = '';
                if(id === 'density' || id === 'stroke') suffix = 'px';
                if(id === 'angle') suffix = '°';
                valEl.textContent = e.target.value + suffix;
            });
        });

        // --- Upload de Imagem ---
        uploadInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            fileNameDisplay.textContent = file.name.length > 20 ? file.name.substring(0, 20) + '...' : file.name;
            
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    // Limita a resolução máxima para garantir performance de geração vetorial
                    const MAX_SIZE = 1000;
                    let w = img.width;
                    let h = img.height;
                    
                    if (w > MAX_SIZE || h > MAX_SIZE) {
                        const ratio = Math.min(MAX_SIZE / w, MAX_SIZE / h);
                        w = Math.floor(w * ratio);
                        h = Math.floor(h * ratio);
                    }

                    imgWidth = w;
                    imgHeight = h;
                    canvas.width = w;
                    canvas.height = h;

                    // Limpa e desenha a imagem original (suporta transparência)
                    ctx.clearRect(0, 0, w, h);
                    ctx.drawImage(img, 0, 0, w, h);
                    
                    // Extrai matriz de pixels
                    imgData = ctx.getImageData(0, 0, w, h);
                    btnGenerate.disabled = false;
                    
                    svgContainer.innerHTML = `<div style="color: var(--accent); font-size: 1rem;">Imagem pronta. Clique em Gerar.</div>`;
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // --- Processamento Principal ---
        btnGenerate.addEventListener('click', () => {
            if (!imgData) return;
            
            // Recolhe valores dos sliders
            settings.density = parseInt(document.getElementById('density').value);
            settings.stroke = parseFloat(document.getElementById('stroke').value);
            settings.edge = parseInt(document.getElementById('edge').value);
            settings.angle = parseInt(document.getElementById('angle').value);
            settings.jitter = parseFloat(document.getElementById('jitter').value);

            loading.style.display = 'flex';
            
            // Timeout para permitir que a UI mostre o Loading antes do processamento pesado travar a thread
            setTimeout(() => {
                const svgString = processVectorArt();
                currentSvgString = svgString;
                svgContainer.innerHTML = svgString;
                btnExport.style.display = 'flex';
                loading.style.display = 'none';
            }, 50);
        });

        // --- Exportação ---
        btnExport.addEventListener('click', () => {
            if (!currentSvgString) return;
            const blob = new Blob([currentSvgString], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'vector-screentone.svg';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // --- Algoritmos do Core Vetorial ---

        function getPixelLuma(data, w, x, y) {
            if (x < 0 || x >= w || y < 0 || y >= imgHeight) return { luma: 255, alpha: 0 };
            const i = (y * w + x) * 4;
            const alpha = data[i + 3];
            // Fórmula Luma standard HD
            const luma = (0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2]);
            return { luma, alpha };
        }

        function processVectorArt() {
            const w = imgWidth;
            const h = imgHeight;
            const data = imgData.data;
            
            let edgePaths = [];
            let hatchPaths = [];

            // 1. Deteção de Bordas (Filtro Sobel Simulado p/ Vetores)
            const threshold = settings.edge;
            
            if (threshold < 200) { // Se 200, consideramos bordas desativadas na UI
                for (let y = 1; y < h - 1; y++) {
                    for (let x = 1; x < w - 1; x++) {
                        const i = (y * w + x) * 4;
                        // Ignora áreas totalmente transparentes para poupar cálculo
                        if (data[i+3] < 50) continue; 

                        // Sobel X e Y simplificado (luma direta aproximada usando canal G para velocidade)
                        const p00 = data[((y-1)*w + (x-1))*4 + 1]; const p10 = data[((y-1)*w + x)*4 + 1]; const p20 = data[((y-1)*w + (x+1))*4 + 1];
                        const p01 = data[(y*w + (x-1))*4 + 1];                                            const p21 = data[(y*w + (x+1))*4 + 1];
                        const p02 = data[((y+1)*w + (x-1))*4 + 1]; const p12 = data[((y+1)*w + x)*4 + 1]; const p22 = data[((y+1)*w + (x+1))*4 + 1];

                        const gx = (p20 + 2*p21 + p22) - (p00 + 2*p01 + p02);
                        const gy = (p02 + 2*p12 + p22) - (p00 + 2*p10 + p20);
                        
                        const mag = Math.sqrt(gx*gx + gy*gy);

                        if (mag > threshold) {
                            // Cria um micro-segmento SVG. O linecap "round" fará parecer um ponto natural ou linha orgânica
                            let jx = x + (Math.random() - 0.5) * settings.jitter;
                            let jy = y + (Math.random() - 0.5) * settings.jitter;
                            edgePaths.push(`M${jx.toFixed(1)},${jy.toFixed(1)}l0.5,0.5`);
                        }
                    }
                }
            }

            // 2. Geração de Hachuras / Screentone Vetorial
            const baseSpacing = settings.density;
            const angleRad = settings.angle * Math.PI / 180;
            const cosA = Math.cos(angleRad);
            const sinA = Math.sin(angleRad);
            const diag = Math.sqrt(w*w + h*h);
            const cx_center = w / 2;
            const cy_center = h / 2;

            // Função para gerar uma camada de linhas paralelas vetoriais
            function generateHatchLayer(spacing, offset, minDarkness) {
                // Varremos a imagem com a rotação aplicada
                for (let y_prime = -diag/2 + offset; y_prime < diag/2; y_prime += spacing) {
                    let isDrawing = false;
                    
                    // Avançamos ao longo da linha em pequenos saltos (resolução da linha)
                    for (let x_prime = -diag/2; x_prime < diag/2; x_prime += 2) {
                        // Converte as coordenadas rodadas de volta para o plano da imagem (x, y)
                        let mapX = Math.floor(cx_center + x_prime * cosA - y_prime * sinA);
                        let mapY = Math.floor(cy_center + x_prime * sinA + y_prime * cosA);

                        if (mapX < 0 || mapX >= w || mapY < 0 || mapY >= h) {
                            if (isDrawing) isDrawing = false;
                            continue;
                        }

                        const pInfo = getPixelLuma(data, w, mapX, mapY);
                        const darkness = 1.0 - (pInfo.luma / 255.0);

                        // Critério: Não é transparente E é escuro o suficiente para esta camada
                        if (pInfo.alpha > 128 && darkness > minDarkness) {
                            if (!isDrawing) {
                                // Inicia o caminho SVG
                                let jx = mapX + (Math.random() - 0.5) * settings.jitter;
                                let jy = mapY + (Math.random() - 0.5) * settings.jitter;
                                hatchPaths.push(`M${jx.toFixed(1)},${jy.toFixed(1)}`);
                                isDrawing = true;
                            } else {
                                // Apenas adicionamos nós ocasionais com jitter em linhas longas
                                if (Math.random() > 0.8 && settings.jitter > 0) {
                                    let jx = mapX + (Math.random() - 0.5) * settings.jitter;
                                    let jy = mapY + (Math.random() - 0.5) * settings.jitter;
                                    hatchPaths.push(`L${jx.toFixed(1)},${jy.toFixed(1)}`);
                                }
                            }
                        } else {
                            if (isDrawing) {
                                // Termina o segmento da linha vetorial
                                let jx = mapX + (Math.random() - 0.5) * settings.jitter;
                                let jy = mapY + (Math.random() - 0.5) * settings.jitter;
                                hatchPaths.push(`L${jx.toFixed(1)},${jy.toFixed(1)}`);
                                isDrawing = false;
                            }
                        }
                    }
                }
            }

            // Geramos as hachuras em 3 passagens intercaladas progressivas:
            // Intercalar previne que as linhas se sobreponham na perfeição, simulando espessamento/densidade real
            
            // Camada 1: Sombras leves (Muito espaçadas)
            generateHatchLayer(baseSpacing * 3, 0, 0.2);
            
            // Camada 2: Sombras médias (Densidade média)
            generateHatchLayer(baseSpacing * 1.5, baseSpacing * 1.5, 0.5);
            
            // Camada 3: Sombras profundas (Elevada densidade, quase preenchendo as ranhuras base)
            generateHatchLayer(baseSpacing * 0.75, baseSpacing * 0.375, 0.8);

            // 3. Compilação do SVG Final
            // Fundimos milhares de micro-segmentos em apenas 2 nós `<path>` maciços
            // Esta é a técnica de ouro para dominar a performance de renderização no SVG DOM!
            
            const edgePathString = edgePaths.join(' ');
            const hatchPathString = hatchPaths.join(' ');

            return `
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">
    <style>
        .edge { stroke: #000000; stroke-width: ${settings.stroke * 1.2}px; stroke-linecap: round; stroke-linejoin: round; fill: none; }
        .hatch { stroke: #111111; stroke-width: ${settings.stroke}px; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
    <!-- Background Transparent Area -->
    <rect width="${w}" height="${h}" fill="none" />
    
    <!-- Render Hachuras Vetoriais -->
    <path class="hatch" d="${hatchPathString}" />
    
    <!-- Render Bordas e Detalhes Vetoriais -->
    <path class="edge" d="${edgePathString}" />
</svg>`;
        }
    </script>
</body>
</html>
